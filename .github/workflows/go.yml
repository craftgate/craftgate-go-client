name: Craftgate Go Client CI

on: [ push, pull_request ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum version in go.mod and the two supported Go releases.
        go-version: [ '1.21', 'oldstable', 'stable' ]
    name: Build with Go ${{ matrix.go-version }}

    steps:
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.sum

      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Go Lint
        if: matrix.go-version == 'stable'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Get dependencies
        run: |
          go get -v -t -d

      - name: Build
        run: go build -v ./...

      - name: Test
        run: |
          go test
          go test ./adapter/
          go test ./tests -run Idempotency

      # Same version validation as the release workflow, with a fake version.
      - name: Validate version for release dry run
        run: .github/scripts/prepare-release.sh 1.999.0 v

      # Serves HEAD as the validated tag from a local module proxy and checks the header in a module that requires it.
      - name: Release dry run
        run: .github/scripts/release-dry-run.sh "$TAG"

  # Single "build" status for branch protection: passes only if every job above passed.
  build:
    if: always()
    needs: [ test ]
    runs-on: ubuntu-latest

    steps:
      - name: Check results
        run: test "${{ needs.test.result }}" = "success"
